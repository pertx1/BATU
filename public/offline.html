<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Sin conexión · Antola</title>
<style>
  :root { --bg:#f2f2f7; --fg:#000000; --muted:#6c6c70; --accent:#5856d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000000; --fg:#ffffff; --muted:#98989f; --accent:#7d7aff; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); box-sizing:border-box; }
  img { width:72px; height:72px; border-radius:18px; margin-bottom:20px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 24px; line-height:1.5; }
  button { font-size:16px; font-weight:600; border:0; border-radius:12px; padding:14px 22px;
    background:var(--accent); color:#fff; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Sin conexión</h1>
  <p>Antola necesita internet para cargar tus datos.<br>Revisa la conexión e inténtalo de nuevo.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
